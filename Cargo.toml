[package]
name = "fastfetch-scripts"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[[bin]]
name = "fastfetch-scripts"
path = "src/main.rs"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

